schemaVersion: 1
instructions:
  canonical: AGENTS.md
  claude: CLAUDE.md
  gemini: GEMINI.md
  copilot: .github/copilot-instructions.md
scripts:
  changed: check:changed
  fast: check:fast
  full: check
changedChecks:
  - id: lint
    script: lint:files
    extensions: [.js, .jsx, .mjs, .cjs, .ts, .tsx, .mts, .cts]
  - id: typecheck
    script: typecheck
    extensions: [.ts, .tsx, .mts, .cts]
    passPaths: false
fullScanPaths:
  - .github/workflows
  - .oxlintrc.json
  - architecture/foundation
  - foundation.config.yaml
  - package.json
  - packages
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - tooling/deployment-plan
  - tooling/local-solana
  - tooling/security/slither
  - tsconfig.json

schemaVersion: 1
instructions:
  canonical: AGENTS.md
  claude: CLAUDE.md
  gemini: GEMINI.md
  copilot: .github/copilot-instructions.md
scripts:
  changed: check:changed
  fast: check:fast
  full: check
changedChecks:
  - id: lint
    script: lint:files
    extensions: [.js, .jsx, .mjs, .cjs, .ts, .tsx, .mts, .cts]
  - id: typecheck
    script: typecheck
    extensions: [.ts, .tsx, .mts, .cts]
    passPaths: false
fullScanPaths:
  - docs
  - AGENTS.md
  - README.md
  - .agents/skills/docs-authoring
  - .github/workflows
  - .oxlintrc.json

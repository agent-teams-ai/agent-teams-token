schemaVersion: 3
projectId: agent-teams-token

catalog:
  metadataSchemaPath: docs/document-metadata.schema.json
  metadataSidecar:
    kind: path-metadata-map
    path: docs/document-metadata.yaml
  ownerCatalog:
    path: docs/owners.yaml
    contract: foundation.owner-map/v1
  collections:
    - kind: markdown-tree
      root: docs
  excludedPrefixes:
    - docs/templates

authoring:
  mode: create-only
  artifactTypes:
    # Existing accepted ADR-NNN records remain cataloged with immutable IDs.
    # New ADRs use the canonical four-digit authoring identity.
    - type: adr
      initialStatus: proposed
      allowedOwnerIds:
        - architecture
        - product
        - security
      identity:
        kind: explicit
        format: adr-four-digits
      placement:
        kind: collection
        directory: docs/decisions
        filename: numeric-id-slug
      template:
        kind: fenced-markdown-body
        path: docs/templates/adr.md
      heading:
        kind: id-colon-title
      reachability:
        kind: manual-fixed-index
        indexPath: docs/decisions/README.md

    - type: architecture
      initialStatus: active
      allowedOwnerIds:
        - architecture
        - security
      identity:
        kind: explicit
        format: qualified
        grammar:
          prefixSegments:
            - token
            - architecture
          minSuffixSegments: 1
          maxSuffixSegments: 8
      placement:
        kind: collection
        directory: docs/architecture
        filename: slug
      template:
        kind: fenced-markdown-body
        path: docs/templates/architecture.md
      heading:
        kind: title
      reachability:
        kind: manual-fixed-index
        indexPath: docs/README.md

    - type: open-decision
      initialStatus: open
      allowedOwnerIds:
        - architecture
        - product
        - security
        - tokenomics
      identity:
        kind: explicit
        format: open-decision-three-digits
      placement:
        kind: collection
        directory: docs/open-decisions
        filename: id-slug
      template:
        kind: fenced-markdown-body
        path: docs/templates/open-decision.md
      heading:
        kind: id-colon-title
      reachability:
        kind: manual-fixed-index
        indexPath: docs/README.md

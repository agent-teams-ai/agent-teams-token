[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
cbor_metadata = true
build_info = true
build_info_path = "out/build-info"
extra_output = ["abi", "evm.bytecode", "evm.deployedBytecode", "metadata", "storageLayout"]
extra_output_files = ["abi"]
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 64, fail_on_revert = true }

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 512, depth = 128, fail_on_revert = true }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true

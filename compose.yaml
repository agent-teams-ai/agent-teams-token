name: agent-teams-token

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.0@sha256:502b630dbbffd94d493122cd849c71d13633d5e5114588568a564434c64687e7
    # Override the image's `sh -c` entrypoint so every Anvil argument is kept.
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 2s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
